<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Escáner de códigos</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6f8; --fg:#1c2330; --card:#ffffff; --accent:#1565c0; --ok:#2e7d32; --warn:#b26a00; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121820; --fg:#eef2f6; --card:#1d2632; --accent:#64b5f6; --ok:#66bb6a; --warn:#ffb74d; --err:#ef5350; } }
  :root[data-theme="dark"] { --bg:#121820; --fg:#eef2f6; --card:#1d2632; --accent:#64b5f6; --ok:#66bb6a; --warn:#ffb74d; --err:#ef5350; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body { min-height: 100vh; padding: 16px; display: flex; flex-direction: column; gap: 14px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 4px 0 0; }
  label { font-size: 1rem; font-weight: 600; display: block; margin-bottom: 6px; }
  select, input { width: 100%; font-size: 1.25rem; padding: 14px; border-radius: 12px; border: 2px solid #9aa5b1; background: var(--card); color: var(--fg); min-height: 56px; }
  .video-wrap { position: relative; width: 100%; aspect-ratio: 3 / 4; max-height: 52vh; background: #000; border-radius: 16px; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; inset: 18% 8%; border: 3px solid var(--ok); border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }
  .status { font-size: 1.1rem; text-align: center; padding: 10px; border-radius: 12px; background: var(--card); min-height: 48px; }
  .status.err { color: var(--err); } .status.ok { color: var(--ok); }
  .result { background: var(--card); border-radius: 16px; padding: 16px; display: none; flex-direction: column; gap: 12px; }
  .result.show { display: flex; }
  .code { font-size: 2rem; font-weight: 800; word-break: break-all; text-align: center; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .fmt { text-align: center; opacity: .75; font-size: 1rem; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font-size: 1.3rem; font-weight: 700; min-height: 68px; border: none; border-radius: 14px; padding: 12px; color: #fff; background: var(--accent); width: 100%; touch-action: manipulation; }
  button.secondary { background: #6b7785; }
  button.send { background: var(--ok); }
  button:disabled { opacity: .5; }
  .hint { font-size: .95rem; opacity: .75; text-align: center; margin: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <h1>Escáner de códigos</h1>

  <div>
    <label for="tipo">Tipo</label>
    <select id="tipo">
      <option value="Bodega">Bodega</option>
      <option value="Envío">Envío</option>
    </select>
  </div>

  <div>
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" autocomplete="name" placeholder="Tu nombre">
  </div>

  <div class="video-wrap" id="videoWrap">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"></div>
  </div>

  <div id="status" class="status">Iniciando cámara…</div>

  <div id="result" class="result" aria-live="polite">
    <div class="fmt" id="fmt"></div>
    <div class="code" id="code"></div>
    <div>
      <label for="cantidad">Cantidad</label>
      <input id="cantidad" type="number" inputmode="numeric" min="1" value="1">
    </div>
    <div>
      <label for="notas">Notas</label>
      <input id="notas" type="text" placeholder="Opcional">
    </div>
    <div class="row">
      <button id="btnCancel" class="secondary" type="button">Cancelar</button>
      <button id="btnSend" class="send" type="button">Enviar</button>
    </div>
  </div>

  <button id="btnRestart" class="hidden" type="button">Escanear otro</button>
  <p class="hint">Apunta la cámara trasera al código EAN-13 o Code 128.</p>

<script>
  // Configuración: URL de la aplicación web de Apps Script y token.
  const ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbxbUoSXkz5haODcOFT3yV_8pO5bxRt_KgUW3jHUUXJpWe3NzOvESEBO01hOGhrAOCc/exec';
  const TOKEN = 'MO-TOKEN';
  const HOJA = 'Escaneos';
  const FORMATS = ['ean_13', 'code_128'];

  const video = document.getElementById('video');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const codeEl = document.getElementById('code');
  const fmtEl = document.getElementById('fmt');
  const btnSend = document.getElementById('btnSend');
  const btnCancel = document.getElementById('btnCancel');
  const btnRestart = document.getElementById('btnRestart');
  const cantidadEl = document.getElementById('cantidad');
  const notasEl = document.getElementById('notas');
  const usuarioEl = document.getElementById('usuario');
  const tipoEl = document.getElementById('tipo');

  let stream = null;
  let detector = null;
  let scanning = false;
  let current = null;

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  async function start() {
    if (!('BarcodeDetector' in window)) {
      setStatus('Este navegador no soporta BarcodeDetector. Usa Chrome en Android.', 'err');
      return;
    }
    try {
      const supported = await BarcodeDetector.getSupportedFormats();
      const formats = FORMATS.filter(f => supported.includes(f));
      if (!formats.length) {
        setStatus('El navegador no soporta EAN-13 ni Code 128.', 'err');
        return;
      }
      detector = new BarcodeDetector({ formats });
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      scanning = true;
      setStatus('Buscando código…');
      loop();
    } catch (err) {
      setStatus('No se pudo abrir la cámara. Revisa los permisos y que la página sea HTTPS.', 'err');
    }
  }

  async function loop() {
    while (scanning) {
      try {
        const codes = await detector.detect(video);
        const hit = codes.find(c => FORMATS.includes(c.format));
        if (hit) { onDetected(hit); return; }
      } catch (e) { /* frame no listo */ }
      await new Promise(r => setTimeout(r, 150));
    }
  }

  function onDetected(hit) {
    scanning = false;
    current = { codigo: hit.rawValue, formato: hit.format === 'ean_13' ? 'EAN-13' : 'Code 128' };
    if (navigator.vibrate) navigator.vibrate(120);
    codeEl.textContent = current.codigo;
    fmtEl.textContent = current.formato;
    cantidadEl.value = 1;
    notasEl.value = '';
    resultEl.classList.add('show');
    btnRestart.classList.add('hidden');
    setStatus('Código detectado', 'ok');
  }

  function cancelResult() {
    resultEl.classList.remove('show');
    current = null;
    btnRestart.classList.remove('hidden');
    setStatus('Escaneo en pausa');
  }

  function restart() {
    btnRestart.classList.add('hidden');
    setStatus('Buscando código…');
    scanning = true;
    loop();
  }

  async function send() {
    if (!current) return;
    const usuario = usuarioEl.value.trim();
    if (!usuario) { setStatus('Escribe tu nombre en Usuario.', 'err'); usuarioEl.focus(); return; }
    btnSend.disabled = true;
    setStatus('Enviando…');
    const payload = {
      token: TOKEN,
      hoja: HOJA,
      tipo: tipoEl.value,
      codigo: current.codigo,
      formato: current.formato,
      cantidad: Number(cantidadEl.value) || 1,
      usuario,
      notas: notasEl.value.trim(),
      fecha: new Date().toISOString()
    };
    try {
      // Apps Script no devuelve cabeceras CORS: se envía en modo no-cors.
      await fetch(ENDPOINT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      setStatus('Enviado: ' + current.codigo, 'ok');
      resultEl.classList.remove('show');
      current = null;
      btnRestart.classList.remove('hidden');
    } catch (err) {
      setStatus('Error de red. Intenta de nuevo.', 'err');
    } finally {
      btnSend.disabled = false;
    }
  }

  btnSend.addEventListener('click', send);
  btnCancel.addEventListener('click', cancelResult);
  btnRestart.addEventListener('click', restart);

  start();
</script>
</body>
</html>
